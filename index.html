      const audioRef = useRef(null);

      useEffect(() => {
        let cancelled = false;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (!ctx) { setUseFallback(true); return; }

        fetch(url, { mode: 'cors', credentials: 'omit' })
          .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.arrayBuffer(); })
          .then(buf => ctx.decodeAudioData(buf))
          .then(decoded => {
            if (cancelled) return;
            const source = ctx.createBufferSource();
            source.buffer = decoded;
            source.loop = true;
            const gain = ctx.createGain();
            gain.gain.value = isMuted ? 0 : volume;
            source.connect(gain);
            gain.connect(ctx.destination);
            audioRef.current = { source, gain, ctx };
            if (isPlaying && !isPaused) source.start(0);
          })
          .catch(() => { if (!cancelled) setUseFallback(true); });

        return () => {
          cancelled = true;
          if (audioRef.current) {
            try { audioRef.current.source.stop(); } catch (_) {}
            try { audioRef.current.ctx.close(); } catch (_) {}
            audioRef.current = null;
          }
        };

        if (audioRef.current && audioRef.current.ctx.state === 'suspended') audioRef.current.ctx.resume().catch(() => {});

        return React.createElement('audio', { ref: fallbackRef, src: url, loop: true, style: { display: 'none' } });

        groupRef.current.position.y = jinnPosRef.current.y + Math.sin(t * 3) * 0.15;
        if (cloakRef.current) {
          cloakRef.current.rotation.z = Math.sin(t * 2) * 0.08;
          cloakRef.current.rotation.x = (isHunting ? 0.25 : 0.05) + Math.sin(t * 4) * 0.05;

        const eyeIntensity = isHunting ? 3.5 + Math.sin(t * 15) * 1.5 : 1.8 + Math.sin(t * 4) * 0.5;

    // ================================================================
    // FIRST PERSON INVESTIGATOR
    // ================================================================
    function FirstPersonInvestigator({ gameState, setGameState, inputRef, onCollectScripture, onUpdateHUD, collectedIds, jinnPosRef, isHuntingRef, gateUnlocked }) {
      const { camera, gl } = useThree();
      const playerPos = useRef(new THREE.Vector3(0, 1.7, 14));
      const flashlightSpotRef = useRef(null);
      const flashlightMeshRef = useRef(null);
      const playerYaw = useRef(Math.PI);
      const playerPitch = useRef(0);
      const staminaRef = useRef(getConfig('maxStamina'));
      const batteryRef = useRef(100);
      const fearRef = useRef(0);
      const flashlightOnRef = useRef(true);
      const wasInteracting = useRef(false);
      const wasFlashlightToggle = useRef(false);
      const lastFootstepTime = useRef(0);
      const lastWhisperTime = useRef(0);
      const isPointerLocked = useRef(false);

      useEffect(() => {
        const canvas = gl.domElement;
        const handlePointerLockChange = () => { isPointerLocked.current = document.pointerLockElement === canvas; };
        const handleCanvasClick = () => { if (gameState.status === 'PLAYING' && !isPointerLocked.current) canvas.requestPointerLock?.(); };
        const handleMouseMove = (e) => {
          if (!isPointerLocked.current || gameState.status !== 'PLAYING') return;
          playerYaw.current -= e.movementX * 0.0022;
          playerPitch.current -= e.movementY * 0.0022;
          playerPitch.current = clamp(playerPitch.current, -Math.PI / 2.3, Math.PI / 2.3);
        };
        document.addEventListener('pointerlockchange', handlePointerLockChange);
        canvas.addEventListener('click', handleCanvasClick);
        window.addEventListener('mousemove', handleMouseMove);
        return () => {
          document.removeEventListener('pointerlockchange', handlePointerLockChange);
          canvas.removeEventListener('click', handleCanvasClick);
          window.removeEventListener('mousemove', handleMouseMove);
        };
      }, [gl, gameState.status]);

      useFrame(({ clock }, delta) => {
        if (gameState.status !== 'PLAYING') return;
        const dt = Math.min(delta, 0.1);
        const actions = inputRef.current?.actions;
        const now = clock.getElapsedTime();

        const interactPressed = actions?.confirm || inputRef.current?.customInteract;
        const flashlightPressed = inputRef.current?.customFlashlight;
        const isSprinting = inputRef.current?.customSprint && staminaRef.current > 10;

        if (flashlightPressed && !wasFlashlightToggle.current) {
          flashlightOnRef.current = !flashlightOnRef.current;
          gameAudio.playJumpLandingThud();
        }
        wasFlashlightToggle.current = !!flashlightPressed;

        const walkSpeed = getConfig('walkSpeed');
        const sprintSpeed = getConfig('sprintSpeed');
        let currentSpeed = walkSpeed;

        if (isSprinting) {
          currentSpeed = sprintSpeed;
          staminaRef.current = Math.max(0, staminaRef.current - dt * 28);
        } else {
          staminaRef.current = Math.min(getConfig('maxStamina'), staminaRef.current + dt * 16);
        }

        if (flashlightOnRef.current) {
          batteryRef.current = Math.max(0, batteryRef.current - dt * getConfig('flashlightBatteryDrain'));
          if (batteryRef.current <= 0) flashlightOnRef.current = false;
        } else {
          batteryRef.current = Math.min(100, batteryRef.current + dt * 4.0);
        }

        if (!isPointerLocked.current && inputRef.current?.touchLookDelta) {
          const td = inputRef.current.touchLookDelta;
          playerYaw.current -= td.x * 0.004;
          playerPitch.current -= td.y * 0.004;
          playerPitch.current = clamp(playerPitch.current, -Math.PI / 2.3, Math.PI / 2.3);
          inputRef.current.touchLookDelta = { x: 0, y: 0 };
        }

        _camEuler.set(playerPitch.current, playerYaw.current, 0);
        camera.quaternion.setFromEuler(_camEuler);
        _forward.set(0, 0, -1).applyEuler(new THREE.Euler(0, playerYaw.current, 0));
        _right.set(1, 0, 0).applyEuler(new THREE.Euler(0, playerYaw.current, 0));

        _v1.set(0, 0, 0);
        if (actions?.up) _v1.add(_forward);
        if (actions?.down) _v1.sub(_forward);
        if (actions?.right) _v1.add(_right);
        if (actions?.left) _v1.sub(_right);

        const isMoving = _v1.lengthSq() > 0.001;
        if (isMoving) {
          _v1.normalize();
          const nextX = playerPos.current.x + _v1.x * currentSpeed * dt;
          const nextZ = playerPos.current.z + _v1.z * currentSpeed * dt;
          playerPos.current.x = clamp(nextX, -16.5, 16.5);
          playerPos.current.z = clamp(nextZ, -16.5, 16.5);
          const footstepInterval = isSprinting ? 0.32 : 0.52;
          if (now - lastFootstepTime.current > footstepInterval) {
            gameAudio.playFootstepWood();
            lastFootstepTime.current = now;
          }
        }

        const bob = isMoving ? Math.sin(now * (isSprinting ? 14 : 9)) * 0.05 : 0;
        camera.position.set(playerPos.current.x, playerPos.current.y + bob, playerPos.current.z);

        const distToJinn = playerPos.current.distanceTo(jinnPosRef.current);
        const maxFear = getConfig('maxFear');

        if (distToJinn < 14) {
          const proximityFactor = Math.max(0, 1 - distToJinn / 14);
          fearRef.current = Math.min(maxFear, fearRef.current + proximityFactor * dt * 26);
          if (now - lastWhisperTime.current > 2.8 - proximityFactor * 1.5) {
            gameAudio.playErrorBuzz();
            lastWhisperTime.current = now;
          }
          if (distToJinn < 1.6 || fearRef.current >= maxFear) {
            gameAudio.playDefeatMotif();
            const finalScore = collectedIds.length * 200;
            setGameState((prev) => ({ ...prev, status: 'GAME_OVER', score: finalScore }));
            
            // GamePix Report Game Over
            if (window.GamePixSDK) window.GamePixSDK.pingGameOver(finalScore);
            
            return;
          }
        } else {
          fearRef.current = Math.max(0, fearRef.current - dt * 6.0);
        }

        if (flashlightSpotRef.current) {
          camera.getWorldDirection(_v2);
          flashlightSpotRef.current.position.copy(camera.position);
          flashlightSpotRef.current.target.position.copy(camera.position).addScaledVector(_v2, 10);
          flashlightSpotRef.current.target.updateMatrixWorld();
          let flickerMultiplier = 1.0;
          if (distToJinn < 12) flickerMultiplier = Math.random() > 0.4 ? (Math.random() > 0.7 ? 0.1 : 0.4) : 1.0;
          flashlightSpotRef.current.intensity = flashlightOnRef.current ? 35.0 * (batteryRef.current / 100) * flickerMultiplier : 0;
        }

        if (flashlightMeshRef.current) {
          flashlightMeshRef.current.position.copy(camera.position).addScaledVector(_forward, 0.55).addScaledVector(_right, 0.3).add(new THREE.Vector3(0, -0.25, 0));
          flashlightMeshRef.current.quaternion.copy(camera.quaternion);
        }

        let promptText = null;
        for (const scripture of SCRIPTURE_DATA) {
          if (collectedIds.includes(scripture.id)) continue;
          _v1.set(...scripture.position);
          if (playerPos.current.distanceTo(_v1) < 2.4) {
            promptText = `[E / TAP] Collect ${scripture.name}`;
            if (interactPressed && !wasInteracting.current) {
              gameAudio.playPowerupChime();
              onCollectScripture(scripture.id);
              fearRef.current = Math.max(0, fearRef.current - 40);
            }
            break;
          }
        }

        if (gateUnlocked) {
          _v1.set(0, 1.7, 17.0);
          const distToGate = playerPos.current.distanceTo(_v1);
          if (distToGate < 3.2) {
            promptText = 'ENTER THE GATE TO ESCAPE!';
            if (distToGate < 1.8) {
              gameAudio.playVictoryFanfare();
              const finalScore = 1000 + Math.floor((100 - fearRef.current) * 10);
              setGameState((prev) => ({ ...prev, status: 'VICTORY', score: finalScore }));
              
              // GamePix Report Victory
              if (window.GamePixSDK) window.GamePixSDK.pingVictory(finalScore);
              
              return;
            }
          }
        } else {
          _v1.set(0, 1.7, 17.0);
          if (playerPos.current.distanceTo(_v1) < 3.0) {
            promptText = `Gate Sealed by Jinn! (${collectedIds.length}/${SCRIPTURE_DATA.length} Scriptures Found)`;
          }
        }

        wasInteracting.current = !!interactPressed;

        onUpdateHUD({
          stamina: staminaRef.current,
          battery: batteryRef.current,
          fear: fearRef.current,
          flashlightOn: flashlightOnRef.current,
          nearPrompt: promptText,
          jinnDistance: distToJinn,
        });
      });

      return React.createElement(React.Fragment, null,
        React.createElement('spotLight', {
          ref: flashlightSpotRef,
          color: '#fff5e6',
          angle: Math.PI / 4.2,
          penumbra: 0.4,
          distance: 24,
          decay: 1.8,
          castShadow: true,
          'shadow-mapSize': [1024, 1024],
          'shadow-bias': -0.0002,
        }),
        React.createElement('group', { ref: flashlightMeshRef },
          React.createElement('mesh', { position: [0, 0, 0], rotation: [Math.PI / 2, 0, 0] },
            React.createElement('cylinderGeometry', { args: [0.04, 0.045, 0.28, 12] }),
            React.createElement('meshStandardMaterial', { color: '#2a2a2a', metalness: 0.8, roughness: 0.3 })
          ),
          React.createElement('mesh', { position: [0, 0, -0.15], rotation: [Math.PI / 2, 0, 0] },
            React.createElement('cylinderGeometry', { args: [0.07, 0.045, 0.08, 12] }),
            React.createElement('meshStandardMaterial', { color: '#1a1a1a', metalness: 0.9, roughness: 0.2 })
          ),
          React.createElement('mesh', { position: [0, 0, -0.19] },
            React.createElement('sphereGeometry', { args: [0.05, 12, 12] }),
            React.createElement('meshStandardMaterial', {
              color: flashlightOnRef.current ? '#ffffdd' : '#555555',
              emissive: flashlightOnRef.current ? '#ffffee' : '#000000',
              emissiveIntensity: flashlightOnRef.current ? 3.0 : 0,
            })
          )
        )
      );
    }

      useFrame(({ clock }, delta) => {
        if (gameState.status !== 'PLAYING') return;
        const dt = Math.min(delta, 0.1);
        const jinnSpeed = isHuntingRef.current ? getConfig('jinnHuntSpeed') : getConfig('jinnSpeed');
        const distToPlayer = jinnPosRef.current.distanceTo(camera.position);

        if (distToPlayer < 9.0) {
          if (!isHuntingRef.current) { isHuntingRef.current = true; setIsHuntingVisual(true); }
        } else if (distToPlayer > 18.0 && isHuntingRef.current) {
          isHuntingRef.current = false; setIsHuntingVisual(false);
        }

        if (isHuntingRef.current) {
          _v1.copy(camera.position).sub(jinnPosRef.current);
          _v1.y = 0;
          if (_v1.lengthSq() > 0.1) { _v1.normalize(); jinnPosRef.current.addScaledVector(_v1, jinnSpeed * dt); }
        } else {
          const targetWp = JINN_WAYPOINTS[jinnWaypointIndex.current];
          _v1.set(targetWp[0], targetWp[1], targetWp[2]);
          if (jinnPosRef.current.distanceTo(_v1) < 1.2) {
            jinnWaypointIndex.current = (jinnWaypointIndex.current + 1) % JINN_WAYPOINTS.length;
          } else {
            _v2.copy(_v1).sub(jinnPosRef.current);
            _v2.y = 0;

            jinnPosRef.current.addScaledVector(_v2, jinnSpeed * dt);
